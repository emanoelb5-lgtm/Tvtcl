name: Compilar APK TCL Light

on:
  push:
    branches: [main, premium-tv-v06]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        run: |
          echo "SDK disponível em: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "Gerenciador: $SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      # Mantém a chave debug entre builds quando o cache estiver disponível.
      # Para distribuição definitiva, configurar uma assinatura release privada.
      - name: Preservar assinatura de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tcl-light-debug-keystore-v1

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar cinco fotografias offline
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/build_wallpapers.py

      - name: Compilar APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Habilitar KVM para testes de TV
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verificar navegação em Android TV 720p
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p dist/qa
            collect_qa() {
              adb pull /sdcard/Android/data/com.b5solucoes.tcllight/files/qa dist/qa/screens || true
              adb shell dumpsys gfxinfo com.b5solucoes.tcllight > dist/qa/gfxinfo.txt || true
              adb logcat -d -s AndroidRuntime:E > dist/qa/crashes.txt || true
            }
            trap collect_qa EXIT
            adb shell settings put system system_locales pt-BR
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Light-TV-QA
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            dist/qa/

      - name: Preparar arquivo para download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TCL-Light-beta.apk

      - name: Disponibilizar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Light-APK
          path: dist/TCL-Light-beta.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK na aba Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta > /dev/null 2>&1 || gh release create beta --title 'TCL Light • Beta' --prerelease --notes 'TCL Light 0.6: nova central lateral, navegação para controle e imagens fora da thread de interface. Instale e teste antes de definir como Home. Não modifica o firmware.'
          gh release upload beta dist/TCL-Light-beta.apk --clobber
