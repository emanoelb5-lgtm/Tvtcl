name: Compilar e publicar TCL Light

on:
  push:
    branches: [main, performance-v013, signed-releases]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    if: github.ref != 'refs/heads/signed-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar fotografias offline
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/build_wallpapers.py
          python3 tools/fetch_upgrade_baseline.py
      - name: Compilar launcher e testes
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon --stacktrace
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar controle e organização em Android TV 720p
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/verify_tv.sh
      - name: Guardar resultados e telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Light-TV-QA
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            dist/qa/
      - name: Preparar release sem assinatura e teste de atualização
        run: python3 tools/prepare_unsigned.py
      - name: Disponibilizar para assinatura privada
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Light-Unsigned
          path: dist/unsigned/*
          if-no-files-found: error
          retention-days: 90

  publish-signed:
    if: github.ref == 'refs/heads/signed-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Baixar publicação assinada
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar ferramentas Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bloquear pacote, versão ou certificado incorreto
        run: |
          python3 tools/verify_signed.py
          python3 tools/fetch_upgrade_baseline.py
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar atualização real sobre a instalação existente
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/verify_upgrade.py
      - name: Guardar prova da atualização
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Light-Upgrade-QA
          path: dist/upgrade-qa/
      - name: Publicar somente após a assinatura e a atualização passarem
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_signed.sh
      - name: Verificar atualização interna pelo canal publicado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/verify_internal_update.py
      - name: Guardar prova da atualização interna
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Light-Internal-Update-QA
          path: dist/internal-update-qa/
      - name: Publicar resultado da atualização interna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("signing/version.json"))["version_name"])')
          gh release upload "v${version}" "dist/internal-update-qa/TCL-Light-${version}-atualizacao-interna.json" --clobber
          gh release upload beta "dist/internal-update-qa/TCL-Light-${version}-atualizacao-interna.json" --clobber
